<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jon Huml • Links</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #000000;
      --link: #0000ee;
      --visited: #551a8b;
      --accent: #ff00ff;
      --border: #000000;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      line-height: 1.35;
    }

    .page {
      max-width: 760px;
      margin: 24px auto;
      padding: 12px;
    }

    h1 {
      margin: 0 0 8px 0;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    a:link { color: var(--link); }
    a:visited { color: var(--visited); }
    a:hover { background: #ffff00; }

    .nav {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .nav li {
      display: inline;
      margin-right: 10px;
    }

    hr {
      border: 0;
      border-top: 2px solid var(--border);
      margin: 14px 0;
    }

    .box {
      border: 2px solid var(--border);
      padding: 10px;
      background: #f7f7f7;
    }

    .profile-links {
      margin: 0;
      padding-left: 18px;
    }
    .profile-links li { margin: 6px 0; }

    footer { margin-top: 14px; }
    .mono {
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Links</h1>
    <ul class="nav" aria-label="Site links">
      <li><a href="index.html">Home</a></li>
      <li><a href="files/Jon_Huml_Resume.pdf">CV</a></li>
      <li><a href="projects.html">Research</a></li>
      <li><a href="gallery.html">Photos</a></li>
    </ul>

    <hr />

    <section id="links" class="box" aria-label="Profile links">
      <ul class="profile-links">
        <li><a href="https://www.linkedin.com/in/jonhuml/">LinkedIn</a></li>
        <li><a href="https://github.com/jonathanhuml">Github</a></li>
        <li><a href="https://scholar.google.com/citations?user=OHSoU54AAAAJ&hl=en&oi=ao">Google Scholar</a></li>
        <li><a href="https://x.com/jonhumlatnight">X</a></li>
      </ul>
    </section>

    <footer>
      <hr />
      <div class="mono">
        © <span id="year">1999</span> Jonathan Huml •
        <span style="color:var(--accent);">zero rights reserved, nothing worth stealing :(</span>
      </div>
    </footer>
  </div>
</body>
</html>
